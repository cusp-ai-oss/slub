[project]
name = "slub"
version = "0.1.1"
description = "Minimal JAX interpreter layer for threading custom context through traced computations"
readme = "README.md"
authors = [
    { name = "Jonas Köhler", email = "jonas@cusp.ai" },
    { name = "CuspAI OpenSource Team", email = "opensource@cusp.ai" },
]
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["jax>=0.7.1"]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "pytest>=8.3.5",
    "pytest-xdist>=3.8.0",
    "pytest-env>=1.1.5",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.7.0",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest_env]
JAX_PLATFORMS = "cpu"
JAX_ENABLE_X64 = "True"

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
addopts = "-n auto --durations=10 --dist worksteal -v --color=yes"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# JAX internals are fundamentally untyped — suppress the noise
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportMissingParameterType = false
reportMissingTypeStubs = false

[tool.ruff]
src = ["src"]

[tool.coverage.run]
branch = true
source = ["src/slub"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
